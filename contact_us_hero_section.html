<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Section – Safiya Packers &amp; Movers</title>
  <style>
    :root {
      --orange: #f58220;
      --blue: #123b70;
      --blue-deep: #0b2850;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #172b43;
      background: var(--white);
      line-height: 1.6;
    }

    /* ===== HERO SECTION ONLY ===== */
    .hero {
      background: linear-gradient(120deg, rgba(11,40,80,.97), rgba(18,59,112,.91)),
        radial-gradient(circle at 90% 15%, rgba(245,130,32,.38), transparent 30%);
      color: white;
      padding: 70px 5% 76px;
      position: relative;
      overflow: hidden;
    }
    .hero:after {
      content: "";
      position: absolute;
      width: 280px; height: 280px;
      border: 45px solid rgba(255,255,255,.06);
      border-radius: 50%;
      right: -75px; bottom: -170px;
    }
    .hero-inner {
      width: min(1160px, 100%);
      margin: auto;
      position: relative;
      z-index: 1;
    }
    .eyebrow {
      display: inline-block;
      color: #ffc27e;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    h1 {
      font-size: clamp(34px, 5vw, 54px);
      line-height: 1.12;
      margin: 0 0 16px;
      letter-spacing: -.8px;
    }
    .hero p {
      max-width: 650px;
      color: #e3edf8;
      margin: 0;
      font-size: 17px;
    }
    .hero-line {
      width: 74px;
      height: 5px;
      background: var(--orange);
      border-radius: 20px;
      margin-top: 25px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 760px) {
      .hero { padding: 53px 5% 58px; }
    }
  </style>
</head>
<body>

  <!-- ===== HERO SECTION ===== -->
  <section class="hero">
    <div class="hero-inner">
      <span class="eyebrow">We're here to help</span>
      <h1>Contact Us</h1>
      <p>Find Safiya Packers &amp; Movers in Hadapsar, Pune. Call us any time for your moving and transportation enquiries.</p>
      <div class="hero-line"></div>
    </div>
  </section>

</body>
</html>
