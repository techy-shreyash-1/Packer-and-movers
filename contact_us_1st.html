<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Section – Safiya Packers &amp; Movers</title>
  <style>
    :root {
      --orange: #f58220;
      --orange-dark: #d96508;
      --blue: #123b70;
      --blue-deep: #0b2850;
      --white: #ffffff;
      --muted: #62738a;
      --line: #e0e8f1;
      --shadow: 0 18px 45px rgba(18, 59, 112, .10);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #172b43;
      background: var(--white);
      line-height: 1.6;
    }
    a { color: inherit; }

    /* ===== LOCATION SECTION ONLY ===== */
    main {
      width: min(1160px, 90%);
      margin: 52px auto 70px;
    }
    .section-heading {
      text-align: center;
      margin-bottom: 28px;
    }
    .section-heading .eyebrow {
      display: inline-block;
      color: var(--orange-dark);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
    }
    h2 {
      color: var(--blue);
      font-size: clamp(25px, 3vw, 34px);
      line-height: 1.2;
      margin: 0 0 10px;
    }
    .section-heading p {
      color: var(--muted);
      margin: 0;
    }
    .map-card {
      border: 1px solid var(--line);
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
      margin-bottom: 30px;
    }
    .map-title {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .map-title h2 { font-size: 22px; margin: 0; }
    .map-title p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .map-frame {
      display: block;
      width: 100%;
      height: 390px;
      border: 0;
    }
    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      padding: 12px 17px;
      border-radius: 9px;
      font-weight: 750;
      text-decoration: none;
      border: 0;
      cursor: pointer;
      transition: .2s ease;
      white-space: nowrap;
    }
    .btn-orange {
      background: var(--orange);
      color: white;
    }
    .btn-orange:hover {
      background: var(--orange-dark);
      transform: translateY(-1px);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 760px) {
      main { margin-top: 35px; }
      .map-title {
        align-items: flex-start;
        flex-direction: column;
        padding: 18px;
      }
      .map-frame { height: 310px; }
    }
  </style>
</head>
<body>

  <!-- ===== LOCATION SECTION ===== -->
  <main>
    <section aria-labelledby="location-heading">
      <div class="section-heading">
        <span class="eyebrow">Find our location</span>
        <h2 id="location-heading">Visit Safiya Packers &amp; Movers</h2>
        <p>Use the map below to locate us or get directions to our address.</p>
      </div>

      <div class="map-card">
        <div class="map-title">
          <div>
            <h2>Our Location</h2>
            <p>Survey No.165, Sadesatara, Nali Road, Hadapsar, Pune</p>
          </div>
          <a class="btn btn-orange" href="https://www.google.com/maps/dir/?api=1&destination=Safiya+Packers+%26+Movers%2C+Survey+No.165%2C+Sadesatara%2C+Nali+Road%2C+near+Datta+Temple%2C+Malwadi%2C+Hadapsar%2C+Pune%2C+Maharashtra%2C+411028" target="_blank" rel="noopener noreferrer">↗ Get Directions</a>
        </div>
        <iframe class="map-frame"
          title="Map showing Safiya Packers and Movers in Hadapsar, Pune"
          src="https://maps.google.com/maps?q=Safiya%20Packers%20%26%20Movers%2C%20Survey%20No.165%2C%20Sadesatara%2C%20Nali%20Road%2C%20near%20Datta%20Temple%2C%20Malwadi%2C%20Hadapsar%2C%20Pune%2C%20Maharashtra%2C%20411028&output=embed"
          loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      </div>
    </section>
  </main>

</body>
</html>
