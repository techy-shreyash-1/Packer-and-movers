<style>
  /* ---- Fix: right-side gray gap on mobile ---- */
  html {
    width: 100vw;
    max-width: 100vw;
    overflow-x: clip;
  }
  body {
    width: 100%;
    max-width: 100vw;
    margin: 0;
    overflow-x: clip;
  }
  *, *::before, *::after {
    box-sizing: border-box;
  }

  .hdr {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #ffffff;
    border-bottom: 1px solid #e4e9ef;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    width: 100%;
  }
  .hdr-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px 16px 0;
    max-width: 1240px;
    margin: 0 auto;
  }
  .hdr-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
  }
  .hdr-logo-mark {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, #e45712, #174a7e);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .hdr-logo-mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .hdr-logo-text .name {
    font-size: 1.15rem;
    font-weight: 800;
    color: #174a7e;
    letter-spacing: .03em;
    line-height: 1.1;
  }
  .hdr-logo-text .tag {
    font-size: .68rem;
    color: #42627f;
    letter-spacing: .02em;
  }
  .hdr-right {
    display: flex;
    align-items: center;
    gap: 34px;
  }
  .hdr-links {
    display: flex;
    align-items: center;
    gap: 34px;
    list-style: none;
  }
  .hdr-links a {
    font-size: .93rem;
    font-weight: 500;
    color: #1c2b3a;
    text-decoration: none;
    position: relative;
    padding-bottom: 6px;
  }
  .hdr-links a.active {
    color: #e45712;
    font-weight: 700;
  }
  .hdr-links a.active::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: #e45712;
  }
  .hdr-links a:hover {
    color: #e45712;
  }
  .hdr-link-icon {
    display: none;
  }
  .hdr-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 24px;
    border-radius: 8px;
    font-weight: 600;
    font-size: .95rem;
    border: 1.5px solid transparent;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    white-space: nowrap;
    text-decoration: none;
    cursor: pointer;
  }
  .hdr-btn-primary {
    background: #e45712;
    color: #ffffff;
  }
  .hdr-btn-primary:hover {
    background: #174a7e;
    box-shadow: 0 10px 24px rgba(23,74,126,.22);
    transform: translateY(-2px);
  }
  .hdr-btn-login {
    background: transparent;
    color: #e45712;
    border-color: #e45712;
    padding: 11px 20px;
  }
  .hdr-btn-login:hover {
    background: #e45712;
    color: #fff;
    transform: translateY(-2px);
  }
  .hdr-btns-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  @media (max-width: 760px) {
    .hdr-nav {
      flex-wrap: nowrap;
      padding: 14px 20px;
    }
    .hdr-right {
      gap: 10px;
      width: auto;
      justify-content: flex-end;
    }
    .hdr-links {
      display: none !important;
    }
    .hdr-burger {
      display: none;
    }
    .hdr-logo-mark {
      width: 32px;
      height: 32px;
    }
    .hdr-logo-text .name {
      font-size: 1rem;
    }
    .hdr-logo-text .tag {
      font-size: .62rem;
    }
    .hdr-btn-login {
      padding: 9px 14px;
      font-size: .85rem;
      width: 90px;
      justify-content: center;
    }
    .hdr-btn-primary {
      display: none;
    }
  }

  /* ==========================================
     MOBILE BOTTOM NAVIGATION (IN-LINE & ENLARGED PHONE)
  ========================================== */
  .hdr-bottom-nav { display: none; }

  @media (max-width: 760px) {
    .hdr-bottom-nav {
      display: grid !important;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 14px;
      width: calc(100% - 32px) !important;
      height: 72px;
      padding: 4px 6px calc(4px + env(safe-area-inset-bottom));
      background: #ffffff;
      border: 1px solid #edf0f4;
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(23,74,126,.16), 0 2px 8px rgba(23,74,126,.06);
      z-index: 10000;
      overflow: visible;
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    }

    .hdr-bottom-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 100%;
      color: #42627f;
      background: transparent;
      border: none;
      text-decoration: none;
      font-size: 10px;
      line-height: 1;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color .2s ease, transform .15s ease;
    }

    .hdr-bottom-item svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hdr-bottom-item.active {
      color: #e45712;
      font-weight: 750;
    }
    .hdr-bottom-item:active {
      transform: scale(0.92);
    }

    /* CENTER PHONE BUTTON (LARGER SIZE & IN-LINE) */
    .hdr-bottom-call {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 0;
    }

    .hdr-bottom-call-circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e45712 0%, #174a7e 100%);
      box-shadow: 0 4px 14px rgba(23,74,126,.22);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .hdr-bottom-call-circle svg {
      width: 22px;
      height: 22px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2.2;
    }

    .hdr-bottom-call:active .hdr-bottom-call-circle {
      transform: scale(0.92);
      box-shadow: 0 2px 8px rgba(13,40,70,.2);
    }

    body {
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
    }
  }

  @media (max-width: 380px) {
    .hdr-bottom-nav {
      left: 10px;
      right: 10px;
      bottom: 10px;
      width: calc(100% - 20px) !important;
      height: 66px;
      border-radius: 24px;
    }
    .hdr-bottom-item {
      font-size: 9px;
    }
    .hdr-bottom-item svg {
      width: 19px;
      height: 19px;
    }
    .hdr-bottom-call-circle {
      width: 40px;
      height: 40px;
    }
    .hdr-bottom-call-circle svg {
      width: 19px;
      height: 19px;
    }
  }

  /* ==========================================
     MOBILE BOTTOM SHEET ("ALL SECTIONS" DRAWER)
  ========================================== */
  .hdr-sheet-backdrop {
    display: none;
  }

  @media (max-width: 760px) {
    .hdr-sheet-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(23, 74, 126, 0.48);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 100000;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .25s ease, visibility .25s ease;
    }

    .hdr-sheet-backdrop.open {
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto !important;
    }

    body.hdr-menu-open {
      overflow: hidden !important;
    }

    .hdr-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-height: 72vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      background: #ffffff;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -12px 35px rgba(23, 74, 126, 0.22);
      padding: 12px 18px calc(24px + env(safe-area-inset-bottom));
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hdr-sheet-backdrop.open .hdr-sheet {
      transform: translateY(0);
    }

    .hdr-sheet-handle {
      grid-column: 1 / -1;
      width: 40px;
      height: 5px;
      border-radius: 4px;
      background: #d4dde6;
      margin: 0 auto 6px;
    }

    .hdr-sheet-top {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .hdr-sheet-title {
      font-size: 1.18rem;
      font-weight: 800;
      color: #174a7e;
      margin: 0;
    }

    /* ---- CUT / CLOSE BUTTON ---- */
    .hdr-sheet-close {
      display: flex !important;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      border-radius: 50%;
      background: #edf2f7;
      border: 1px solid #dce5ef;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      color: #174a7e;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .hdr-sheet-close:active {
      background: #dbe4ef;
      transform: scale(0.92);
    }

    .hdr-sheet-close svg {
      width: 18px;
      height: 18px;
      stroke: #174a7e !important;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      display: block;
    }

    .hdr-sheet-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 86px;
      padding: 12px 8px;
      text-align: center;
      text-decoration: none;
      background: #f7fafd;
      border: 1px solid #e2ebf3;
      border-radius: 14px;
      transition: background .2s ease, transform .15s ease, border-color .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .hdr-sheet-item:active {
      background: #eef6fc;
      border-color: #e45712;
      transform: scale(0.97);
    }

    .hdr-sheet-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      stroke: #e45712;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hdr-sheet-label {
      font-size: .88rem;
      font-weight: 700;
      color: #174a7e;
    }
  }

  /* ==========================================
     STICKY FLOATING BUTTONS (CTA)
  ========================================== */
  .sizo-sticky-buttons {
    position: fixed;
    bottom: 30px;
    right: 30px;
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    gap: 15px;
    z-index: 9999;
    font-family: 'DM Sans', 'Inter', sans-serif;
    pointer-events: none;
  }

  .sizo-float-btn {
    display: flex;
    align-items: center;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    pointer-events: auto;
    position: relative;
    box-shadow: 0 5px 15px rgba(26, 18, 9, 0.2);
  }

  .sizo-pill-btn {
    height: 45px;
    border-radius: 35px;
    padding: 0 16px;
    gap: 8px;
    justify-content: center;
  }

  .sizo-pill-btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
    z-index: 2;
  }

  .sizo-pill-text {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    z-index: 2;
    color: #ffffff;
  }

  .sizo-circle-btn {
    width: 60px;
    height: 60px;
    justify-content: center;
    border-radius: 50%;
  }

  .sizo-circle-btn svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
    z-index: 2;
  }

  @keyframes sizo-pulse-purple {
    0% { box-shadow: 0 0 0 0 rgba(23, 74, 126, 0.45); transform: scale(1); }
    50% { transform: scale(1.03); }
    70% { box-shadow: 0 0 0 20px rgba(128, 90, 213, 0); }
    100% { box-shadow: 0 0 0 0 rgba(128, 90, 213, 0); transform: scale(1); }
  }

  @keyframes sizo-pulse-orange {
    0% { box-shadow: 0 0 0 0 rgba(228, 87, 18, 0.7); transform: scale(1); }
    50% { transform: scale(1.03); }
    70% { box-shadow: 0 0 0 20px rgba(228, 87, 18, 0); }
    100% { box-shadow: 0 0 0 0 rgba(228, 87, 18, 0); transform: scale(1); }
  }

  @keyframes sizo-pulse-green {
    0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); transform: scale(1); }
    50% { transform: scale(1.05); }
    70% { box-shadow: 0 0 0 20px rgba(37, 211, 102, 0); }
    100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); transform: scale(1); }
  }

  @keyframes sizo-pulse-teal {
    0% { box-shadow: 0 0 0 0 rgba(23, 74, 126, 0.45); transform: scale(1); }
    50% { transform: scale(1.03); }
    70% { box-shadow: 0 0 0 20px rgba(20, 168, 168, 0); }
    100% { box-shadow: 0 0 0 0 rgba(20, 168, 168, 0); transform: scale(1); }
  }

  .sizo-btn-guide {
    background: linear-gradient(135deg, #174a7e 0%, #0f355b 100%);
    color: #ffffff;
    animation: sizo-pulse-purple 2.5s infinite;
  }

  .sizo-btn-inquiry {
    background: linear-gradient(135deg, #E45712 0%, #c5480c 100%);
    color: #ffffff;
    animation: sizo-pulse-orange 2.5s infinite;
    animation-delay: 1.2s;
  }

  .sizo-btn-whatsapp {
    background: #25D366;
    color: #ffffff;
    animation: sizo-pulse-green 2.5s infinite;
    animation-delay: 1.8s;
  }

  .sizo-btn-smart {
    background: linear-gradient(135deg, #174a7e 0%, #0f355b 100%);
    color: #ffffff;
    animation: sizo-pulse-teal 2.5s infinite;
    animation-delay: 0.3s;
  }

  @media (max-width: 768px) {
    .sizo-sticky-buttons {
      bottom: 96px;
      right: 15px;
      gap: 8px;
    }
    .sizo-pill-btn {
      height: 38px;
      padding: 0 10px;
      gap: 4px;
    }
    .sizo-pill-btn svg {
      width: 14px;
      height: 14px;
    }
    .sizo-pill-text {
      font-size: 11px;
    }
    .sizo-circle-btn { 
      width: 45px;
      height: 45px;
    }
    .sizo-circle-btn svg {
      width: 20px;
      height: 20px;
    }
  }

  @media (max-width: 520px) {
    .sizo-sticky-buttons {
      gap: 6px;
      right: 12px;
      bottom: 96px;
    }
    .sizo-pill-btn {
      padding: 0 8px;
    }
    .sizo-pill-text {
      font-size: 10px;
    }
    .sizo-pill-btn svg {
      width: 12px;
      height: 12px;
    }
    .sizo-circle-btn {
      width: 42px;
      height: 42px;
    }
    .sizo-circle-btn svg {
      width: 18px;
      height: 18px;
    }
  }
</style>

<!-- ════ JAVASCRIPT LOGIC ════ -->
<script>
  (function() {
    var backdrop = document.getElementById('hdrSheetBackdrop');

    function openMenu() {
      if (!backdrop) return;
      backdrop.classList.add('open');
      document.body.classList.add('hdr-menu-open');
    }

    function closeMenu() {
      if (!backdrop) return;
      backdrop.classList.remove('open');
      document.body.classList.remove('hdr-menu-open');
    }

    // Global listener for Menu triggers and Sheet items
    document.addEventListener('click', function(e) {
      if (e.target.closest('#hdrBottomMenuBtn')) {
        e.preventDefault();
        e.stopPropagation();
        openMenu();
        return;
      }

      if (e.target.closest('#hdrSheetClose') || e.target === backdrop) {
        e.preventDefault();
        closeMenu();
        return;
      }

      if (e.target.closest('#hdrSheetBackdrop .hdr-sheet-item')) {
        closeMenu();
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });
  })();
</script>
